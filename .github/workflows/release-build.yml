name: Build fork release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release version and SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode (\d+)', lambda m: f'versionCode {int(m[1]) + 1}', s)
          s = re.sub(r'versionName "([^"]+)"', lambda m: f'versionName "{m[1]}-15apps.1"', s)
          p.write_text(s)
          PY

      - name: Verify layout, build release and run tests
        run: |
          python scripts/check-fork-layout.py
          bash gradlew assembleRelease testDebugUnitTest lintRelease --no-daemon

      - name: Collect unsigned APK and signing tool
        run: |
          mkdir -p release-build
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-build/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-build/
          git rev-parse HEAD > release-build/source-commit.txt
          sha256sum release-build/app-release-unsigned.apk > release-build/unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fork-release-build
          path: release-build/
          retention-days: 7
          if-no-files-found: error
